<script>
(async () => {
  'use strict';
  // Home's particle wall. One fixed set of dots fills the card: at rest they
  // draw the opening's mark (the microphone, its two stars, "Voxt" over
  // "SGL-omni"); while the user speaks they flow into the start of what is
  // said. No dot is ever added, removed, recoloured or dimmed: a shape shows
  // only because dots crowd onto it and thin out everywhere else.
  const cfg = JSON.parse(document.getElementById('wall-config').textContent);
  const caption = document.getElementById('caption');
  const cv = document.getElementById('wall'), ctx = cv.getContext('2d');
  const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const load = (src) => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
  const a = cfg.assets;
  const [imgMic, imgOrange, imgPeach, imgWord, imgBy] = await Promise.all([a.mic, a.orange, a.peach, a.word, a.by].map(load));

  // ---------- shapes ----------
  let EYES = [];
  // The opening's layout in its own points (opening.go), with SGL-omni drawn
  // 42 tall instead of 29 so "omni" keeps enough dots to read. Content spans
  // x 45..499 and y 22..166; it is scaled to the card and centred.
  function drawLogo(g, w, h) {
    const GW = 454, GH = 144, s = Math.min(h * 0.82 / GH, w * 0.9 / GW);
    const x0 = (w - GW * s) / 2 - 45 * s, y0 = (h - GH * s) / 2 - 22 * s;
    // the eyes of microphone.png (400×568, drawn 100×142 at 45,24): centres x 155 and 253, y 155, radii 41×55
    EYES = [155, 253].map((ex) => ({ x: x0 + (45 + ex * 0.25) * s, y: y0 + (24 + 155 * 0.25) * s, rx: 41 * 0.25 * s, ry: 55 * 0.25 * s }));
    const at = (img, x, y, bw, bh) => {
      const k = Math.min(bw / img.width, bh / img.height), iw = img.width * k, ih = img.height * k;
      g.drawImage(img, x0 + (x + (bw - iw) / 2) * s, y0 + (y + (bh - ih) / 2) * s, iw * s, ih * s);
    };
    at(imgMic, 45, 24, 100, 142);
    at(imgOrange, 131, 22, 38, 38);
    at(imgPeach, 152, 63, 24, 24);
    at(imgWord, 222, 35, 218, 60);
    // attribution.png without its grey "by" (its left 85 px)
    const k = 42 / imgBy.height;
    g.drawImage(imgBy, 85, 0, imgBy.width - 85, imgBy.height, x0 + 224 * s, y0 + 113 * s, (imgBy.width - 85) * k * s, 42 * s);
  }

  // Latin fonts first: a CJK font first draws accented letters (ś) apart; CJK text falls back to PingFang/Hiragino
  const FONT = '-apple-system,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
  const CJK_RE = /[぀-ヿ一-鿿]/;
  // One line, or two when it does not fit: Chinese and Japanese split in the
  // middle, other text at the space nearest the middle.
  function drawText(text) {
    return (g, w, h) => {
      EYES = [];
      const font = (fs) => `800 ${fs}px ${FONT}`;
      let lines = [text], fs = h * 0.42;
      g.font = font(fs);
      if (g.measureText(text).width > w * 0.86) {
        const ch = [...text], cut = Math.ceil(ch.length / 2);
        lines = [ch.slice(0, cut).join(''), ch.slice(cut).join('')];
        if (!CJK_RE.test(text)) {
          const mid = text.length / 2;
          let best = -1;
          for (let k = 0; k < text.length; k++) if (text[k] === ' ' && (best < 0 || Math.abs(k - mid) < Math.abs(best - mid))) best = k;
          if (best > 0) lines = [text.slice(0, best), text.slice(best + 1)];
        }
        fs = h * 0.34;
      }
      g.font = font(fs);
      const widest = Math.max(...lines.map((l) => g.measureText(l).width));
      if (widest > w * 0.86) fs *= w * 0.86 / widest;
      g.font = font(fs);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const lh = fs * 1.18, y0 = h / 2 - (lines.length - 1) * lh / 2;
      lines.forEach((l, k) => g.fillText(l, w / 2, y0 + k * lh + fs * 0.03));
    };
  }

  // What the wall shows: the start of what was said, cut once it is too long
  // for two lines (12 Chinese or Japanese characters, 28 others), ending in "…".
  function leadText(text) {
    text = (text || '').replace(/\s+/g, ' ').replace(/^[\s\p{P}\p{S}]+/u, '').trim();
    const ch = [...text], max = CJK_RE.test(text) ? 12 : 28;
    if (ch.length <= max) return text;
    let cut = ch.slice(0, max - 1).join('');
    const sp = cut.lastIndexOf(' ');
    if (!CJK_RE.test(text) && sp > max / 2) cut = cut.slice(0, sp);
    return cut.replace(/[\s\p{P}]+$/u, '') + '…';
  }

  // ---------- colours: each dot owns one, for good ----------
  // SGLang's: warm white (dark ink on a light theme), orange, peach. The first
  // three build the shapes; orange and peach always stay in the background.
  const COLORS = cfg.dark
    ? ['rgb(246,242,236)', 'rgb(255,250,244)', 'rgb(232,226,220)', 'rgb(214,96,40)', 'rgb(240,180,150)']
    : ['rgb(52,48,44)', 'rgb(36,33,30)', 'rgb(70,64,58)', 'rgb(214,96,40)', 'rgb(232,150,112)'];
  const PICK = [0, 0, 0, 1, 1, 2, 2, 3, 3, 4];   // 70% ink, 20% orange, 10% peach
  const INKS = 3;

  // ---------- the one fixed set of dots ----------
  const SHAPE_PITCH = 2.5, DOT = 2;
  let N = 0, nInk = 0;
  let ax, ay, tx, ty, t0, dur, amp;   // flight from (ax,ay) to (tx,ty)
  let ox, oy, ovx, ovy, px, py;       // mouse offset, drawn position
  let col;
  let current = 'logo', clock = performance.now() / 1000, settleAt = 0;

  function build() {
    N = Math.round(W * H / (4.2 * 4.2));
    const F = () => new Float32Array(N);
    ax = F(); ay = F(); tx = F(); ty = F(); t0 = F(); dur = F(); amp = F();
    ox = F(); oy = F(); ovx = F(); ovy = F(); px = F(); py = F();
    col = new Uint8Array(N);
    nInk = 0;
    const cols = Math.round(Math.sqrt(N * W / H)), rows = Math.ceil(N / cols);
    for (let i = 0; i < N; i++) {
      const c = i % cols, r = (i / cols) | 0;
      px[i] = tx[i] = (c + 0.5) * W / cols; py[i] = ty[i] = (r + 0.5) * H / rows;
      t0[i] = -1; dur[i] = 1;
      col[i] = PICK[Math.random() * PICK.length | 0];
      if (col[i] < INKS) nInk++;
    }
  }

  // Targets: the shape on a dense lattice, the other dots spread evenly around it.
  const off = document.createElement('canvas'), octx = off.getContext('2d', { willReadFrequently: true });
  function layout(drawFn) {
    const sw = Math.ceil(W), sh = Math.ceil(H);
    off.width = sw; off.height = sh; octx.clearRect(0, 0, sw, sh);
    drawFn(octx, sw, sh);
    let d = octx.getImageData(0, 0, sw, sh).data;
    // centre what was drawn: the images carry transparent padding
    let bx0 = sw, bx1 = -1, by0 = sh, by1 = -1;
    for (let y = 0; y < sh; y += 2) for (let x = 0; x < sw; x += 2) if (d[(y * sw + x) * 4 + 3] > 110) {
      if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
    }
    if (bx1 >= 0) {
      const dx = Math.round((sw - bx1 - bx0) / 2), dy = Math.round((sh - by1 - by0) / 2);
      if (dx || dy) {
        octx.clearRect(0, 0, sw, sh); octx.save(); octx.translate(dx, dy); drawFn(octx, sw, sh); octx.restore();
        d = octx.getImageData(0, 0, sw, sh).data;
        for (const E of EYES) { E.x += dx; E.y += dy; }
      }
    }
    const solid = (x, y) => d[((y | 0) * sw + (x | 0)) * 4 + 3] > 40;
    const shape = [];
    const sc = Math.floor(W / SHAPE_PITCH), sr = Math.floor(H / SHAPE_PITCH);
    const sx0 = (W - (sc - 1) * SHAPE_PITCH) / 2, sy0 = (H - (sr - 1) * SHAPE_PITCH) / 2;
    for (let r = 0; r < sr; r++) for (let c = 0; c < sc; c++) {
      const x = sx0 + c * SHAPE_PITCH, y = sy0 + r * SHAPE_PITCH, k = ((y | 0) * sw + (x | 0)) * 4;
      // dark pixels (the microphone's eyes) stay empty, so they read as holes
      if (d[k + 3] > 110 && d[k] + d[k + 1] + d[k + 2] > 200) shape.push({ x, y, s: 1 });
    }
    let S = shape;
    const cap = Math.floor(nInk * 0.95);
    if (S.length > cap) { const st = S.length / cap; S = Array.from({ length: cap }, (_, i) => shape[Math.floor(i * st)]); }
    const nb = N - S.length;
    let free = 0;
    for (let y = 2; y < sh; y += 4) for (let x = 2; x < sw; x += 4) if (!solid(x, y)) free++;
    const q = Math.sqrt(free * 16 / Math.max(1, nb));
    const bg = [];
    for (let y = q / 2; y < H; y += q) for (let x = q / 2; x < W; x += q) {
      const jx = x + (Math.random() - 0.5) * q * 0.35, jy = y + (Math.random() - 0.5) * q * 0.35;
      if (jx > 0 && jy > 0 && jx < W && jy < H && !solid(jx, jy)) bg.push({ x: jx, y: jy, s: 0 });
    }
    for (let i = bg.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [bg[i], bg[j]] = [bg[j], bg[i]]; }
    if (bg.length > nb) bg.length = nb;
    for (let guard = 0; bg.length < nb && guard < nb * 20; guard++) {
      const x = Math.random() * W, y = Math.random() * H;
      if (!solid(x, y)) bg.push({ x, y, s: 0 });
    }
    while (bg.length < nb) bg.push({ x: Math.random() * W, y: Math.random() * H, s: 0 });
    return S.concat(bg);
  }

  // pair dots with targets so neighbours stay neighbours: x-strips, then y inside each strip
  function stripOrder(n, gx, gy) {
    const idx = Array.from({ length: n }, (_, i) => i).sort((p, q) => gx(p) - gx(q));
    const B = Math.max(1, Math.round(Math.sqrt(n * W / H) / 3));
    for (let b = 0; b < B; b++) {
      const s = Math.floor(b * n / B), e = Math.floor((b + 1) * n / B);
      const part = idx.slice(s, e).sort((p, q) => gy(p) - gy(q));
      for (let k = s; k < e; k++) idx[k] = part[k - s];
    }
    return idx;
  }

  let logoReady = 0, nextIdleBlink = 2.5;
  function morphTo(kind, text) {
    clock = performance.now() / 1000;   // the loop may be asleep
    current = kind === 'logo' ? 'logo' : text;
    if (kind === 'logo') { logoReady = clock + 1.7; nextIdleBlink = logoReady + 1.5 + Math.random() * 2; } else blinkAt = -10;
    const T = layout(kind === 'logo' ? drawLogo : drawText(text));
    for (let i = 0; i < N; i++) { ax[i] = px[i] - ox[i]; ay[i] = py[i] - oy[i]; }
    // orange and peach dots take evenly spread background spots; ink dots the shape and the rest
    const warm = [], ink = [];
    for (let i = 0; i < N; i++) (col[i] >= INKS ? warm : ink).push(i);
    const B = T.filter((t) => !t.s), rest = T.filter((t) => t.s);
    const bo = stripOrder(B.length, (k) => B[k].x, (k) => B[k].y);
    const wo = stripOrder(warm.length, (k) => ax[warm[k]], (k) => ay[warm[k]]);
    const used = new Uint8Array(B.length), pairs = [];
    for (let k = 0; k < warm.length; k++) {
      const b = bo[Math.min(B.length - 1, Math.floor((k + 0.5) * B.length / warm.length))];
      used[b] = 1; pairs.push([warm[wo[k]], B[b]]);
    }
    for (let k = 0; k < B.length; k++) if (!used[k]) rest.push(B[k]);
    const so = stripOrder(ink.length, (k) => ax[ink[k]], (k) => ay[ink[k]]);
    const to = stripOrder(rest.length, (k) => rest[k].x, (k) => rest[k].y);
    for (let k = 0; k < ink.length && k < rest.length; k++) pairs.push([ink[so[k]], rest[to[k]]]);
    const still = cfg.reduceMotion;
    for (const [i, t] of pairs) {
      tx[i] = t.x; ty[i] = t.y;
      t0[i] = still ? -1 : clock + (t.x / W) * 0.3 + Math.random() * 0.05;   // a left-to-right wave
      dur[i] = still ? 1e-3 : 1.0 + Math.random() * 0.2;
      amp[i] = Math.sin(t.y / H * Math.PI * 2 + t.x / W * 3) * 0.12;
    }
    settleAt = still ? clock : clock + 1.6;
    wake();
  }

  // ---------- mouse: a quick push away from the cursor that snaps back ----------
  const mouse = { x: -1e4, y: -1e4, vx: 0, vy: 0, on: false, t: 0 };
  if (!cfg.reduceMotion) {
    cv.addEventListener('pointermove', (e) => {
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (mouse.on) { mouse.vx = mouse.vx * 0.3 + (x - mouse.x) * 0.7; mouse.vy = mouse.vy * 0.3 + (y - mouse.y) * 0.7; }
      mouse.x = x; mouse.y = y; mouse.on = true; mouse.t = performance.now();
      wake();
    });
    cv.addEventListener('pointerleave', () => { mouse.on = false; mouse.x = mouse.y = -1e4; mouse.vx = mouse.vy = 0; });
  }
  const MR = 56, MR2 = MR * MR;

  // ---------- blink: the rows next to each eye close over it, like microphone-blink.png ----------
  let blinkAt = -10, blinkHold = 0;
  function blinkAmount() {
    const t = clock - blinkAt;
    if (t < 0) return 0;
    if (t < 0.08) return t / 0.08;
    if (t < 0.08 + blinkHold) return 1;
    const u = (t - 0.08 - blinkHold) / 0.14;
    return u < 1 ? 1 - u : 0;
  }
  function eyelid(b, x, y) {
    for (const E of EYES) {
      const hx = (x - E.x) / (E.rx * 1.1);
      if (hx <= -1 || hx >= 1) continue;
      const hole = E.ry * Math.sqrt(1 - hx * hx), band = E.ry * 0.9, dy = y - E.y, v = Math.abs(dy);
      if (v < hole || v > hole + band) continue;
      const slit = Math.min(hole, 1.2), shut = (hole - slit) * b;
      return y - Math.sign(dy) * shut * (1 - (v - hole) / band);
    }
    return y;
  }

  // ---------- render: only while something moves ----------
  const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  let last = performance.now(), running = false, sleepTimer = 0;
  const buckets = new Map();
  function wake() {
    clearTimeout(sleepTimer);
    if (!running && W > 0) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  }
  function frame(now) {
    const dt = Math.min(2, (now - last) / 16.67); last = now;
    clock = now / 1000;
    if (now - mouse.t > 40) { mouse.vx *= 0.6; mouse.vy *= 0.6; }
    const kf = 0.2 * dt, df = Math.pow(0.66, dt);
    for (const b of buckets.values()) b.length = 0;
    if (!cfg.reduceMotion && current === 'logo' && clock > logoReady && clock > nextIdleBlink) {
      blinkAt = clock; blinkHold = 0; nextIdleBlink = clock + 3.5 + Math.random() * 3;
    }
    const blink = EYES.length ? blinkAmount() : 0;
    let moving = false;
    for (let i = 0; i < N; i++) {
      const p = Math.min(1, Math.max(0, (clock - t0[i]) / dur[i])), e = ease(p);
      const dx = tx[i] - ax[i], dy = ty[i] - ay[i], bend = Math.sin(Math.PI * e) * amp[i];
      const bx = p >= 1 ? tx[i] : ax[i] + dx * e - dy * bend;
      let by = p >= 1 ? ty[i] : ay[i] + dy * e + dx * bend;
      if (blink > 0) by = eyelid(blink, bx, by);
      if (mouse.on) {
        const mx = bx + ox[i] - mouse.x, my = by + oy[i] - mouse.y, d2 = mx * mx + my * my;
        if (d2 < MR2) {
          const d = Math.sqrt(d2) || 1, f = (1 - d / MR) ** 2;
          ovx[i] += (mx / d * 2.8 + mouse.vx * 0.06) * f * dt; ovy[i] += (my / d * 2.8 + mouse.vy * 0.06) * f * dt;
        }
      }
      if (ox[i] !== 0 || ovx[i] !== 0) { moving = true; ovx[i] = (ovx[i] - ox[i] * kf) * df; ox[i] += ovx[i] * dt; if (Math.abs(ovx[i]) < 0.004 && Math.abs(ox[i]) < 0.02) ox[i] = ovx[i] = 0; }
      if (oy[i] !== 0 || ovy[i] !== 0) { moving = true; ovy[i] = (ovy[i] - oy[i] * kf) * df; oy[i] += ovy[i] * dt; if (Math.abs(ovy[i]) < 0.004 && Math.abs(oy[i]) < 0.02) oy[i] = ovy[i] = 0; }
      px[i] = bx + ox[i]; py[i] = by + oy[i];
      let b = buckets.get(col[i]); if (!b) buckets.set(col[i], b = []);
      b.push(i);
    }

    ctx.clearRect(0, 0, W, H);
    gctx.setTransform(1, 0, 0, 1, 0, 0); gctx.clearRect(0, 0, glow.width, glow.height); gctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
    const h = DOT / 2;
    ctx.globalAlpha = 0.9; gctx.globalAlpha = 0.9;
    for (const [c, idx] of buckets) {
      if (!idx.length) continue;
      ctx.fillStyle = gctx.fillStyle = COLORS[c];
      ctx.beginPath(); gctx.beginPath();
      // whole device pixels keep every dot equally sharp (no moiré)
      for (const i of idx) { ctx.rect(Math.round((px[i] - h) * DPR) / DPR, Math.round((py[i] - h) * DPR) / DPR, DOT, DOT); gctx.rect(px[i] - 2, py[i] - 2, 4, 4); }
      ctx.fill(); gctx.fill();
    }
    if (cfg.dark) {   // a soft glow where the dots crowd
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3; ctx.filter = 'blur(6px)';
      ctx.drawImage(glow, 0, 0, W, H); ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (moving || mouse.on || blink > 0 || clock < settleAt) { requestAnimationFrame(frame); return; }
    // at rest: sleep until the next idle blink
    running = false;
    if (!cfg.reduceMotion && current === 'logo') {
      const wait = Math.max(0.05, Math.max(nextIdleBlink, logoReady) - clock);
      sleepTimer = setTimeout(wake, wait * 1000);
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glow.width = Math.ceil(W / 2); glow.height = Math.ceil(H / 2);
    build();
    morphTo(current === 'logo' ? 'logo' : 'text', current);
  }
  let rz = 0;
  new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(resize, 80); }).observe(cv);

  // ---------- hello in every language Voxt's speech model hears ----------
  // Qwen3-ASR's 30 languages (Voxt/internal/omni/models.go), Chinese in both scripts.
  const HELLOS = [
    ['你好', '简体中文'], ['Hello', 'English'], ['こんにちは', '日本語'], ['안녕하세요', '한국어'],
    ['Bonjour', 'Français'], ['Hola', 'Español'], ['Hallo', 'Deutsch'], ['你好', '繁體中文'], ['Ciao', 'Italiano'],
    ['Olá', 'Português'], ['Привет', 'Русский'], ['مرحبا', 'العربية'], ['नमस्ते', 'हिन्दी'], ['สวัสดี', 'ไทย'],
    ['Xin chào', 'Tiếng Việt'], ['Halo', 'Bahasa Indonesia'], ['Helo', 'Bahasa Melayu'], ['Merhaba', 'Türkçe'], ['Hoi', 'Nederlands'], ['你好', '粵語'],
    ['Hej', 'Svenska'], ['Hejsa', 'Dansk'], ['Hei', 'Suomi'], ['Cześć', 'Polski'], ['Ahoj', 'Čeština'],
    ['Kumusta', 'Filipino'], ['سلام', 'فارسی'], ['Γεια σου', 'Ελληνικά'], ['Szia', 'Magyar'], ['Здраво', 'Македонски'],
    ['Bună', 'Română'],
  ];
  // Voxt first, then back to Voxt between every hello
  const LOGO_HOLD = 2400, HELLO_HOLD = 2400;
  let step = -1, onLogo = true;
  function show(text, label) {
    caption.classList.remove('on');
    setTimeout(() => { caption.textContent = label; caption.classList.toggle('on', !!label); }, 450);
    if (text === null) { morphTo('logo'); return; }
    // from the logo: blink first, then flow into the word
    if (current === 'logo' && !cfg.reduceMotion) { current = text; blinkAt = performance.now() / 1000; blinkHold = 0.06; wake(); setTimeout(() => morphTo('text', text), 150); }
    else morphTo('text', text);
  }
  function next() {
    if (!onLogo) { onLogo = true; show(null, ''); setTimeout(next, LOGO_HOLD); return; }
    onLogo = false;
    step = (step + 1) % HELLOS.length;
    const [text, label] = HELLOS[step];
    show(text, label);
    setTimeout(next, HELLO_HOLD);
  }
  // start once the first layout is in
  const begin = () => { if (W > 0) setTimeout(next, LOGO_HOLD); else setTimeout(begin, 50); };
  begin();
})();

</script>
</body>
